[phases.setup]
nixPkgs = ["python311", "ffmpeg"]

[phases.install]
cmds = [
  # Use the venv pip directly — avoids the externally-managed-environment error
  "/opt/venv/bin/pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu",
  "/opt/venv/bin/pip install -r app/requirements.txt"
]

[start]
cmd = "cd app && uvicorn main:app --host 0.0.0.0 --port $PORT"
