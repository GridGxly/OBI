[phases.setup]
nixPkgs = ["python311", "ffmpeg"]

[phases.install]
cmds = [
  # Let Nixpacks create the venv first, then install with it
  "python3 -m venv /opt/venv || true",
  "/opt/venv/bin/pip install --upgrade pip",
  "/opt/venv/bin/pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu",
  "/opt/venv/bin/pip install -r backend/app/requirements.txt"
]

[start]
cmd = "cd backend/app && /opt/venv/bin/uvicorn main:app --host 0.0.0.0 --port $PORT"
