[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "ffmpeg"]

[phases.install]
cmds = [
  # CPU-only PyTorch — saves ~2.2 GB vs default CUDA wheel
  "pip3 install torch torchaudio --index-url https://download.pytorch.org/whl/cpu",
  # Install everything else
  "pip3 install -r backend/app/requirements.txt"
]

[start]
cmd = "cd backend/app && uvicorn main:app --host 0.0.0.0 --port $PORT"
